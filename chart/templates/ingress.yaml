{{- if .Values.ingress.enabled -}}
{{- $mw := .Values.middleware }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "paas-app-chart.fullname" . }}
  labels:
    {{- include "paas-app-chart.labels" . | nindent 4 }}
  annotations:
    # ---- Middlewares del Ingress NGINX (se configuran en values.yaml o desde el panel) ----
    nginx.ingress.kubernetes.io/ssl-redirect: {{ $mw.sslRedirect | quote }}
    nginx.ingress.kubernetes.io/force-ssl-redirect: {{ $mw.sslRedirect | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ $mw.proxyBodySize | quote }}
    {{- if gt (int $mw.rateLimitRPM) 0 }}
    nginx.ingress.kubernetes.io/limit-rpm: {{ $mw.rateLimitRPM | quote }}
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "1"
    {{- end }}
    {{- if $mw.stickySessions }}
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: {{ .Release.Name }}-route
    {{- end }}
    {{- if $mw.cors }}
    nginx.ingress.kubernetes.io/enable-cors: "true"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "nginx" }}
  {{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.domain | quote }}
      secretName: {{ include "paas-app-chart.tlsSecret" . }}
  {{- end }}
  rules:
    - host: {{ .Values.domain | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "paas-app-chart.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
