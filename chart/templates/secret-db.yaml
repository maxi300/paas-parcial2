{{- if .Values.database.enabled }}
{{- /* Las contraseñas se generan al instalar y se conservan en cada upgrade (no viven en el repositorio) */}}
{{- $name := include "paas-app-chart.dbSecret" . }}
{{- $old := dict }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}{{ $old = .data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "paas-app-chart.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ (get $old "DB_PASSWORD") | default "" | b64dec | default (randAlphaNum 24) | quote }}
  DB_ROOT_PASSWORD: {{ (get $old "DB_ROOT_PASSWORD") | default "" | b64dec | default (randAlphaNum 24) | quote }}
  JWT_SECRET: {{ (get $old "JWT_SECRET") | default "" | b64dec | default (randAlphaNum 40) | quote }}
{{- end }}
