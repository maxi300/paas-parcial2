apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "paas-app-chart.fullname" . }}
  labels:
    {{- include "paas-app-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "paas-app-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Cambia en cada upgrade: los pods se recrean y toman la configuración nueva (panel web)
        paas/config-hash: {{ toJson .Values | sha256sum | trunc 16 | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "paas-app-chart.labels" . | nindent 8 }}
        paas/runtime: {{ .Values.runtime | quote }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "paas-app-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | default .Values.service.port | quote }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.database.enabled }}
            # Conexión a la base de datos: el host y el puerto los define la plataforma;
            # el usuario y la contraseña vienen del Secret (nunca del código ni del repositorio)
            - name: DB_HOST
              value: {{ include "paas-app-chart.dbName" . | quote }}
            - name: DB_PORT
              value: {{ include "paas-app-chart.dbPort" . | quote }}
            - name: DB_NAME
              value: {{ .Values.database.name | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: {{ include "paas-app-chart.dbSecret" . }}, key: DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "paas-app-chart.dbSecret" . }}, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ include "paas-app-chart.dbSecret" . }}, key: JWT_SECRET }
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort | default .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
